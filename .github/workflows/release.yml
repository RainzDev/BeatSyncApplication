name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            artifact_name: BeatmapPorter-linux-x64
          - rid: win-x64
            artifact_name: BeatmapPorter-win-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "BeatmapPoterApplication.csproj"

      - name: Publish application
        run: |
          dotnet publish "BeatmapPoterApplication.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained false \
            -p:PublishSingleFile=false \
            -p:UseAppHost=true

      - name: Package artifact
        shell: bash
        run: |
          PUBLISH_DIR="bin/Release/net10.0/${{ matrix.rid }}/publish"
          ARCHIVE_PATH="${{ matrix.artifact_name }}.zip"
          cd "$PUBLISH_DIR"
          zip -r "../../../../${ARCHIVE_PATH}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Determine release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=Build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            release-artifacts/**/*.zip
          generate_release_notes: true
