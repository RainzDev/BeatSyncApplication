name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
      title:
        description: 'Release title'
        required: true
        default: 'Release'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            artifact_name: BeatmapPorter-linux-x64
          - rid: win-x64
            artifact_name: BeatmapPorter-win-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "BeatmapPoterApplication.csproj"

      - name: Publish application
        shell: bash
        run: |
          dotnet publish "BeatmapPoterApplication.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:UseAppHost=true \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          PUBLISH_DIR="bin/Release/net10.0/${{ matrix.rid }}/publish"
          ARCHIVE_PATH="dist/${{ matrix.artifact_name }}.zip"
          cd "$PUBLISH_DIR"
          zip -r "${GITHUB_WORKSPACE}/${ARCHIVE_PATH}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Set release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ github.event.inputs.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.ZIP
          generate_release_notes: true
          fail_on_unmatched_files: false
