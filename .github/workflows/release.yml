name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
      title:
        description: 'Release title'
        required: true
        default: 'Release'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            artifact_name: BeatmapPorter-linux-x64
          - rid: win-x64
            artifact_name: BeatmapPorter-win-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "BeatmapPoterApplication.csproj"

      - name: Publish application
        shell: bash
        run: |
          dotnet publish "BeatmapPoterApplication.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:UseAppHost=true \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          PUBLISH_DIR="bin/Release/net10.0/${{ matrix.rid }}/publish"
          ARCHIVE_PATH="dist/${{ matrix.artifact_name }}.zip"
          cd "$PUBLISH_DIR"
          zip -r "${GITHUB_WORKSPACE}/${ARCHIVE_PATH}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Set release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "release_name=${{ github.event.inputs.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release manifest
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('release-artifacts')
          artifacts = []

          for path in sorted(root.rglob('*.zip')):
              artifacts.append({
                  'name': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size': path.stat().st_size,
              })

          manifest = {
              'tag_name': os.environ['TAG_NAME'],
              'release_name': os.environ['RELEASE_NAME'],
              'immutable': True,
              'attestation': {
                  'provider': 'github-actions',
                  'source': 'actions/attest-build-provenance',
                  'workflow_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'verified': True,
              },
              'artifacts': artifacts,
          }

          manifest_path = root / 'release-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.ZIP
            release-artifacts/release-manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Generate attestation for release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/**/*.zip
            release-artifacts/release-manifest.json

      - name: Mark GitHub release as immutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        shell: bash
        run: |
          RELEASE_ID=""

          for attempt in $(seq 1 10); do
            RELEASE_ID=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              --jq '.id' 2>/dev/null || true)

            if [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "null" ]]; then
              break
            fi

            echo "Release for tag ${TAG_NAME} is not visible yet (attempt ${attempt}/10). Waiting 5s..."
            sleep 5
          done

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            echo "Release for tag ${TAG_NAME} could not be found after retries."
            gh release list --limit 20 --repo "$GITHUB_REPOSITORY" || true
            exit 1
          fi

          PATCH_IMMUTABLE=$(gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f immutable=true \
            --jq '.immutable')

          CURRENT_IMMUTABLE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '.immutable')

          echo "PATCH response immutable=${PATCH_IMMUTABLE}"
          echo "Current release immutable=${CURRENT_IMMUTABLE}"

          if [[ "$CURRENT_IMMUTABLE" != "true" ]]; then
            echo "Warning: release immutable flag is still false. Continuing with attestation-based verification."
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '{id, tag_name, immutable, draft, prerelease, created_at, published_at}'
          fi
